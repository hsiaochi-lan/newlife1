<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1F1B">
<title>飲食紀錄</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F5; --card:#FFFFFF; --soft:#F6FAF9;
  --ink:#0F1F1B; --ink2:#2A3A35; --mut:#7A8A85; --mut2:#A8B5B1;
  --line:#E5EDEA; --line2:#EDF2F0;
  --ac:#17A88C; --ac-d:#0E7A64; --ac-l:#E3F5F0; --mint:#5BE2BE;
  --water:#3D9BD4; --water-l:#E4EFF7;
  --over:#D65A44; --over-l:#FDF1EF; --over-b:#F8DFDA;
  --pro:#8A63C0; --pro-l:#EDE4F5;
  --veg:#3E9E5E; --veg-l:#DFF0E4;
  --grain:#B5892F; --grain-l:#F5EBD8;
  --fat:#D9962F; --fat-l:#F7EBD6;
  --fruit:#D65A44; --fruit-l:#F8DFDA;
  --dairy:#3D9BD4; --dairy-l:#DFECF7;
  --f:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::selection{background:var(--ac-l)}

.wrap{max-width:460px;margin:0 auto;padding:0 18px}
.hero{background:var(--ink);padding:calc(26px + env(safe-area-inset-top)) 0 62px;position:relative;overflow:hidden}
.hero svg.deco{position:absolute;right:-30px;top:-16px;opacity:.15;pointer-events:none}
.hero .wrap{position:relative}
.kick{font-size:11.5px;letter-spacing:.14em;color:var(--mint);font-weight:500}
.h1{font-size:25px;font-weight:900;color:#fff;line-height:1.3;margin:4px 0 0}
.sub{font-size:13px;color:#8FAFA6;margin-top:4px}

.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px}
.card.lift{box-shadow:0 8px 28px rgba(20,60,50,.10)}
.card.pull{margin:-46px 18px 12px;border-radius:24px}
.ttl{font-size:16.5px;font-weight:700;color:var(--ink)}
.lbl{font-size:11.5px;letter-spacing:.1em;color:var(--mut);font-weight:500}
.mut{color:var(--mut)}
.pill{font-size:11.5px;font-weight:500;color:var(--ac);background:var(--ac-l);padding:4px 10px;border-radius:20px}
.pill.r{color:var(--over);background:var(--over-b)}
.pill.g{color:var(--mut);background:var(--line)}

.btn{border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;display:inline-flex;
  align-items:center;justify-content:center;gap:7px;min-height:46px}
.btn-pri{background:var(--ac);color:#fff;box-shadow:0 6px 18px rgba(23,168,140,.30)}
.btn-pri:active{background:var(--ac-d)}
.btn-sec{background:var(--ac-l);color:var(--ac-d);font-weight:500}
.btn-sec:active{background:#CFEBE3}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:transparent;color:var(--mut);font-weight:500;min-height:38px;padding:0 10px}
.blk{width:100%}
.btn:disabled{opacity:.45;box-shadow:none}

.inp{width:100%;border:1.5px solid var(--line);background:var(--soft);padding:11px 13px;
  border-radius:12px;min-height:46px}
.inp:focus{border-color:var(--ac);background:#fff;outline:none}
textarea.inp{min-height:auto;line-height:1.6}

.bar{border-radius:4px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;display:block;border-radius:4px}

.days{display:flex;gap:5px}
.days button{flex:1;text-align:center;padding:7px 0 8px;border-radius:12px;color:var(--mut2)}
.days button b{display:block;font-size:15px;font-weight:700;margin-top:1px;color:var(--ink2)}
.days button small{font-size:10px}
.days button.on{background:var(--ac);color:#fff}
.days button.on b{color:#fff}

.grow{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.grow.over{background:var(--over-l)}
.chip{width:38px;height:38px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.gnum{font-size:16px;font-weight:700;color:var(--ink)}

.cnt{display:flex;align-items:center;background:var(--soft);border-radius:12px;padding:2px}
.cnt button{width:36px;height:36px;border-radius:10px;font-size:19px;font-weight:700;color:var(--ac-d);
  display:flex;align-items:center;justify-content:center}
.cnt button:active{background:var(--ac-l)}
.cnt span{min-width:30px;text-align:center;font-size:16px;font-weight:700}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.mrow .nm{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink2)}

.thumb{width:58px;height:58px;flex:none;border-radius:14px;background:var(--soft);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);
  overflow:hidden;padding:0;border:1.5px dashed var(--line)}
.thumb.has{border-style:solid;border-color:transparent}
.thumb img{width:100%;height:100%;object-fit:cover}

.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cups button{aspect-ratio:1;border-radius:9px;background:var(--water-l)}
.cups button.on{background:var(--water)}

.cmt{background:var(--ink);border-radius:18px;padding:15px 17px;display:flex;gap:11px;margin-bottom:9px}
.cmt.mine{background:var(--soft)}
.av{width:32px;height:32px;flex:none;border-radius:50%;background:var(--ac);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700}
.cmt .who{font-size:11.5px;letter-spacing:.08em;color:var(--mint)}
.cmt .bd{font-size:13.5px;line-height:1.75;color:#D5E5E0;margin-top:4px}
.cmt.mine .who{color:var(--mut)}
.cmt.mine .bd{color:var(--ink2)}

.warn{background:var(--over-l);border-radius:16px;padding:13px 15px;margin-bottom:12px;
  display:flex;gap:10px;align-items:flex-start}
.warn b{font-size:13.5px;font-weight:700;color:var(--over);display:block}
.warn span{font-size:12.5px;color:#A34A38;line-height:1.6}

.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line2);
  display:flex;padding:9px 0 calc(12px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10.5px;color:var(--mut2)}
.nav button.on{color:var(--ac);font-weight:500}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:13.5px;z-index:60;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center;font-weight:500}
.toast.show{opacity:1}
.sp{text-align:center;padding:60px 18px;color:var(--mut);font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>

<div id="app"><div class="sp">載入中…</div></div>
<div id="toast" class="toast"></div>

<script src="config.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ───────── 常數 ───────── */
const ICON = {
  leaf:'<path d="M20 4c-8 0-14 4.6-14 11.2 0 1.6.4 3 1 4.2C11 15.6 15 12.8 19 11.4c-3.4 1.8-6.6 4.6-8.8 8.8 1 .4 2 .6 3 .6 5.6 0 8.8-5.4 6.8-16.8z"/>',
  egg:'<ellipse cx="12" cy="13.5" rx="7" ry="8"/><path d="M12 5.5c0-1.6 1.2-3 3-3.2"/>',
  grain:'<path d="M12 3c2.4 2.4 3.6 5 3.6 7.8S14.4 16.6 12 19c-2.4-2.4-3.6-5.4-3.6-8.2S9.6 5.4 12 3z"/><path d="M12 8v11"/>',
  drop:'<path d="M12 2.7S5.5 9.9 5.5 14.3a6.5 6.5 0 1 0 13 0C18.5 9.9 12 2.7 12 2.7z"/>',
  apple:'<circle cx="12" cy="14" r="6.5"/><path d="M12 7.5V5c0-1.2 1-2.2 2.4-2.4"/>',
  milk:'<path d="M8 3h8v3l2 3v12H6V9l2-3z"/><path d="M8 6h8"/>',
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>',
  book:'<path d="M4 5h16v15H4z"/><path d="M4 9.5h16M9 3v4M15 3v4"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>',
  people:'<circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.4 2.7-5.6 6-5.6s6 2.2 6 5.6"/><path d="M16 5.2a3.4 3.4 0 0 1 0 6.6M17.5 14.8c2.1.6 3.5 2.4 3.5 5.2"/>',
  cam:'<path d="M3 8h4l1.5-2h7L17 8h4v12H3z"/><circle cx="12" cy="13.5" r="3.6"/>',
};
const GROUPS = [
  ['pro',   '豆魚蛋肉', 5,  'pro',   'egg'],
  ['veg',   '蔬菜',     8,  'veg',   'leaf'],
  ['grain', '全穀雜糧', 10, 'grain', 'grain'],
  ['fat',   '油脂堅果', 3,  'fat',   'drop'],
  ['fruit', '水果',     2,  'fruit', 'apple'],
  ['dairy', '乳品',     2,  'dairy', 'milk'],
];
const SLOTS = [
  ['breakfast', '早餐', '07:30'], ['am_snack',  '早點', '10:00'],
  ['lunch',     '午餐', '12:30'], ['pm_snack',  '午點', '15:30'],
  ['dinner',    '晚餐', '19:00'], ['pm2_snack', '晚點', '21:00'],
];
const KCAL = { pro:75, veg:25, grain:70, fat:45, fruit:60, dairy:120 };
const MACROS = [
  ['醣類',     p => p.grain*15 + p.fruit*15 + p.veg*5 + p.dairy*12, 190, '#D65A44', false],
  ['蛋白質',   p => p.pro*7 + p.grain*2 + p.dairy*8,                 90, '#3D9BD4', false],
  ['脂質',     p => p.fat*5 + p.pro*5 + p.dairy*4,                   50, '#3E9E5E', false],
  ['膳食纖維', p => p.veg*2.4 + p.fruit*2 + p.grain*1.8,             25, '#B5892F', true ],
];
const QUICK = ['蔬菜量夠，維持。', '這餐脂肪少半份。', '蛋白質提前吃。'];

/* ───────── 工具 ───────── */
const $ = s => document.querySelector(s);
const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const k in a) {
    if (k === 'class') n.className = a[k];
    else if (k === 'text') n.textContent = a[k];
    else if (k === 'html') n.innerHTML = a[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), a[k]);
    else if (a[k] !== null && a[k] !== undefined && a[k] !== false) n.setAttribute(k, a[k]);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return n;
};
const svg = (paths, size, color, sw) => {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size);
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', color || 'currentColor');
  s.setAttribute('stroke-width', sw || 1.7);
  s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
  s.innerHTML = paths; return s;
};
const ring = (pct, big, small, color) => {
  const R = 44, C = 2 * Math.PI * R, on = Math.min(100, pct) / 100 * C;
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 104 104'); s.setAttribute('width', '104'); s.setAttribute('height', '104');
  s.innerHTML = '<circle cx="52" cy="52" r="44" fill="none" stroke="#E8F2EE" stroke-width="11"/>' +
    '<circle cx="52" cy="52" r="44" fill="none" stroke="' + color + '" stroke-width="11" stroke-linecap="round"' +
    ' stroke-dasharray="' + on.toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 52 52)"/>';
  return el('div', { style: 'position:relative;width:104px;height:104px;flex:none' }, [
    s,
    el('div', { style: 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center' }, [
      el('div', { style: 'font-size:27px;font-weight:900;line-height:1', text: big }),
      el('div', { style: 'font-size:10px;color:var(--mut);letter-spacing:.04em', text: small }),
    ]),
  ]);
};
const today = () => new Date().toLocaleDateString('sv-SE');
const fmtD = d => d.slice(5).replace('-', '/');
const DOW = ['日','一','二','三','四','五','六'];
const dowOf = d => DOW[new Date(d + 'T00:00:00').getDay()];
const shiftD = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('sv-SE'); };
let toastT;
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000); };

/* ───────── 狀態 ───────── */
let sb, me = null;
const S = { tab:'home', date:today(), log:null, meals:{}, comments:[], photoUrls:{},
            students:[], viewStudent:null };

/* ───────── 啟動 ───────── */
(async function boot() {
  const url = (window.SUPABASE_URL || '').trim();
  const key = (window.SUPABASE_ANON_KEY || '').trim();
  if (!url || !key || url.indexOf('supabase.co') < 0) {
    return fatal('設定讀不到', '偵測到的網址：「' + (url || '（空白）') + '」。確認 config.js 已上傳，然後按 ⌘ + Shift + R 重新整理。');
  }
  if (typeof supabase === 'undefined') return fatal('元件載入失敗', '檢查網路，重新整理頁面。');
  sb = supabase.createClient(url, key);
  const { data } = await sb.auth.getSession();
  if (!data.session) return renderLogin();
  await loadMe();
})();

function fatal(t, m) {
  $('#app').replaceChildren(el('div', { class: 'wrap' }, el('div', { style: 'padding:70px 0' }, [
    el('div', { class: 'ttl', style: 'font-size:22px;margin-bottom:8px', text: t }),
    el('p', { class: 'mut', style: 'font-size:14px;line-height:1.7;margin:0', text: m }),
  ])));
}

async function loadMe() {
  const { data: u } = await sb.auth.getUser();
  if (!u || !u.user) return renderLogin();
  const { data, error } = await sb.from('profiles').select('*').eq('id', u.user.id).single();
  if (error) return fatal('讀不到帳號資料', error.message);
  me = data;
  if (!me.display_name) me.display_name = u.user.email;
  S.tab = me.role === 'coach' ? 'coach' : 'home';
  if (me.role === 'coach') await loadStudents();
  await loadDay();
}

/* ───────── 登入 ───────── */
function renderLogin() {
  const email = el('input', { class: 'inp', type: 'email', placeholder: 'you@example.com', autocomplete: 'username' });
  const pass  = el('input', { class: 'inp', type: 'password', placeholder: '密碼', autocomplete: 'current-password' });
  const msg   = el('p', { class: 'mut', style: 'font-size:13px;margin:0;min-height:18px' });
  const go = async () => {
    msg.textContent = '登入中…';
    const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    if (error) { msg.textContent = '登入失敗：' + error.message; return; }
    $('#app').replaceChildren(el('div', { class: 'sp', text: '載入中…' }));
    await loadMe();
  };
  pass.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#app').replaceChildren(
    el('div', { class: 'hero', style: 'padding-bottom:80px' }, [
      el('div', { class: 'wrap' }, [
        el('div', { class: 'kick', text: 'DIET LOG' }),
        el('div', { class: 'h1', style: 'font-size:30px', text: '飲食紀錄' }),
        el('div', { class: 'sub', text: '每天記，教練看得到。' }),
      ]),
      (() => { const s = svg(ICON.leaf, 170, '#5BE2BE', 1); s.setAttribute('class', 'deco'); return s; })(),
    ]),
    el('div', { class: 'wrap' }, el('div', { class: 'card lift', style: 'margin-top:-46px;border-radius:24px;gap:0' }, [
      el('div', { class: 'lbl', style: 'margin-bottom:6px', text: 'EMAIL' }), email,
      el('div', { class: 'lbl', style: 'margin:14px 0 6px', text: '密碼' }), pass,
      el('button', { class: 'btn btn-pri blk', style: 'margin-top:16px', onclick: go, text: '登入' }),
      el('p', { class: 'mut', style: 'font-size:12.5px;margin:12px 0 0;text-align:center', text: '帳號由教練建立，忘記密碼找教練。' }),
      msg,
    ]))
  );
}

/* ───────── 資料 ───────── */
function targetId() { return me.role === 'coach' ? (S.viewStudent || me.id) : me.id; }

async function loadStudents() {
  const { data } = await sb.from('profiles').select('id,display_name,role').eq('role', 'student').order('display_name');
  S.students = data || [];
  if (!S.viewStudent && S.students.length) S.viewStudent = S.students[0].id;
}

async function loadDay() {
  const sid = targetId();
  S.log = null; S.meals = {}; S.comments = []; S.photoUrls = {};
  const { data: logs } = await sb.from('daily_logs').select('*').eq('student_id', sid).eq('log_date', S.date).limit(1);
  S.log = logs && logs[0] ? logs[0] : null;
  if (S.log) {
    const [{ data: ms }, { data: cs }] = await Promise.all([
      sb.from('meals').select('*').eq('daily_log_id', S.log.id),
      sb.from('comments').select('*, profiles(display_name)').eq('daily_log_id', S.log.id).order('created_at'),
    ]);
    (ms || []).forEach(m => { S.meals[m.slot] = m; });
    S.comments = cs || [];
    await Promise.all((ms || []).filter(m => m.photo_path).map(async m => {
      const { data } = await sb.storage.from('meal-photos').createSignedUrl(m.photo_path, 3600);
      if (data) S.photoUrls[m.slot] = data.signedUrl;
    }));
  }
  render();
}

async function ensureLog() {
  if (S.log) return S.log;
  const { data, error } = await sb.from('daily_logs').insert({ student_id: me.id, log_date: S.date }).select().single();
  if (error) { toast('建立失敗：' + error.message); throw error; }
  S.log = data; return data;
}
async function ensureMeal(slot) {
  if (S.meals[slot]) return S.meals[slot];
  const log = await ensureLog();
  const { data, error } = await sb.from('meals').insert({ daily_log_id: log.id, slot }).select().single();
  if (error) { toast('儲存失敗：' + error.message); throw error; }
  S.meals[slot] = data; return data;
}

const saveQ = {}; let saveT;
async function bump(slot, gk, d) {
  const m = await ensureMeal(slot);
  const p = Object.assign({}, m.portions || {});
  p[gk] = Math.max(0, Math.min(12, (p[gk] || 0) + d));
  m.portions = p; saveQ[slot] = true; render();
  clearTimeout(saveT); saveT = setTimeout(flush, 700);
}
async function flush() {
  const slots = Object.keys(saveQ);
  for (const s of slots) {
    delete saveQ[s];
    const m = S.meals[s]; if (!m) continue;
    const { error } = await sb.from('meals').update({ portions: m.portions }).eq('id', m.id);
    if (error) toast('儲存失敗：' + error.message);
  }
  if (slots.length) toast('已存');
}
async function patchLog(fields) {
  const log = await ensureLog();
  Object.assign(S.log, fields); render();
  const { error } = await sb.from('daily_logs').update(fields).eq('id', log.id);
  if (error) toast('儲存失敗：' + error.message);
}

async function pickPhoto(slot) {
  const inp = el('input', { type: 'file', accept: 'image/*', class: 'hide' });
  document.body.appendChild(inp);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    toast('上傳中…');
    try {
      const m = await ensureMeal(slot);
      const path = me.id + '/' + S.date + '/' + slot + '.jpg';
      const { error } = await sb.storage.from('meal-photos').upload(path, f, { upsert: true, contentType: f.type });
      if (error) return toast('上傳失敗：' + error.message);
      await sb.from('meals').update({ photo_path: path }).eq('id', m.id);
      m.photo_path = path;
      const { data } = await sb.storage.from('meal-photos').createSignedUrl(path, 3600);
      if (data) S.photoUrls[slot] = data.signedUrl;
      render(); toast('照片好了');
    } catch (e) { toast('上傳失敗'); }
  });
  inp.click();
}

/* ───────── 計算 ───────── */
function totals() {
  const t = { pro:0, veg:0, grain:0, fat:0, fruit:0, dairy:0 };
  Object.values(S.meals).forEach(m => {
    const p = m.portions || {};
    GROUPS.forEach(([k]) => { t[k] += Number(p[k] || 0); });
  });
  return t;
}
const kcalOf = t => GROUPS.reduce((a, [k]) => a + t[k] * KCAL[k], 0);
function macrosOf(t) {
  return MACROS.map(([name, fn, target, color, floor]) => {
    const g = Math.round(fn(t) * 10) / 10, over = !floor && g > target;
    return { name, g, target, color, over, diff: Math.round((g - target) * 10) / 10,
      pct: Math.min(100, Math.round(g / target * 100)) };
  });
}

/* ───────── 片段 ───────── */
function dayStrip() {
  const days = [];
  for (let i = 6; i >= 0; i--) days.push(shiftD(today(), -i));
  return el('div', { class: 'days' }, days.map(d => el('button', {
    class: d === S.date ? 'on' : '', onclick: async () => { S.date = d; await loadDay(); },
  }, [ el('small', { text: dowOf(d) }), el('b', { text: String(Number(d.slice(8))) }) ])));
}

function overWarn(t, mac) {
  const items = [];
  GROUPS.forEach(([k, nm, tg]) => { if (t[k] > tg) items.push(nm + ' 多 ' + (t[k] - tg) + ' 份'); });
  mac.forEach(m => { if (m.over) items.push(m.name + ' 多 ' + m.diff + ' g'); });
  if (!items.length) return null;
  return el('div', { class: 'warn' }, [
    svg('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/>', 20, 'var(--over)', 1.8),
    el('div', {}, [ el('b', { text: '超標了' }), el('span', { text: items.join('、') }) ]),
  ]);
}

function groupRow(k, nm, tg, cvar, icon, n) {
  const over = n > tg;
  return el('div', { class: 'grow' + (over ? ' over' : '') }, [
    el('div', { class: 'chip', style: 'background:var(--' + cvar + '-l)' }, svg(ICON[icon], 21, 'var(--' + cvar + ')')),
    el('div', { style: 'flex:1;min-width:0' }, [
      el('div', { style: 'display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px' }, [
        el('span', { style: 'font-size:13.5px;font-weight:500;color:var(--ink2)' }, [
          el('span', { text: nm }),
          over ? el('span', { style: 'font-size:11px;color:var(--over);margin-left:6px', text: '多 ' + (n - tg) + ' 份' }) : null,
        ]),
        el('span', { style: 'font-size:13px;color:var(--mut)' }, [
          el('b', { class: 'gnum', style: over ? 'color:var(--over)' : '', text: String(n) }),
          el('span', { text: ' / ' + tg }),
        ]),
      ]),
      el('div', { class: 'bar', style: 'height:6px;background:' + (over ? 'var(--over-b)' : 'var(--line)') },
        el('i', { style: 'width:' + Math.min(100, Math.round(n / tg * 100)) + '%;background:var(--' + (over ? 'over' : cvar) + ')' })),
    ]),
  ]);
}

      el('div', { class: 'sub', text: me.role === 'coach' ? '教練帳號' : '學員帳號' }),
    ]),
    (() => { const s = svg(ICON.user, 150, '#5BE2BE', 1); s.setAttribute('class', 'deco'); return s; })(),
  ]);
  const nameI = el('input', { class: 'inp', value: me.display_name || '' });
  nameI.addEventListener('change', async () => {
    const v = nameI.value.trim(); if (!v) return;
    const { error } = await sb.from('profiles').update({ display_name: v }).eq('id', me.id);
    if (error) return toast('儲存失敗：' + error.message);
    me.display_name = v; toast('已存'); render();
  });
  const kcalI = el('input', { class: 'inp', type: 'number', inputmode: 'numeric', value: me.kcal_goal || 1500 });
  kcalI.addEventListener('change', async () => {
    const v = Number(kcalI.value) || 1500;
    const { error } = await sb.from('profiles').update({ kcal_goal: v }).eq('id', me.id);
    if (error) return toast('儲存失敗：' + error.message);
    me.kcal_goal = v; toast('已存'); render();
  });
  return [head, el('div', { class: 'wrap' }, [
    el('div', { class: 'card lift', style: 'margin-top:-36px;border-radius:24px' }, [
      el('div', { class: 'lbl', text: '顯示名稱' }), nameI,
      el('div', { class: 'lbl', style: 'margin-top:8px', text: '每日熱量目標' }), kcalI,
    ]),
    el('button', { class: 'btn btn-sec blk', style: 'margin-bottom:14px',
      onclick: async () => { await sb.auth.signOut(); location.reload(); }, text: '登出' }),
    el('p', { class: 'mut', style: 'font-size:12px;line-height:1.7;margin:0 0 24px',
      text: '營養素換算為暫估係數，以營養師建議為準。' }),
  ])];
}

/* ───────── 導覽 ───────── */
function nav() {
  const items = me.role === 'coach'
    ? [['coach', 'people', '學員'], ['home', 'home', '單日'], ['set', 'user', '我的']]
    : [['home', 'home', '首頁'], ['log', 'book', '紀錄'], ['set', 'user', '我的']];
  return el('nav', { class: 'nav' }, items.map(([k, ic, label]) => el('button', {
    class: S.tab === k ? 'on' : '', onclick: () => { S.tab = k; window.scrollTo(0, 0); render(); },
  }, [ svg(ICON[ic], 21, 'currentColor', S.tab === k ? 2 : 1.7), el('span', { text: label }) ])));
}

function render() {
  const body = S.tab === 'coach' ? coachView()
    : S.tab === 'log' ? logView()
    : S.tab === 'set' ? setView()
    : homeView();
  $('#app').replaceChildren(...body.filter(Boolean), nav());
}
</script>
</body>
</html>
